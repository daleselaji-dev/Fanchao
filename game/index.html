<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>返潮 FANCHAO ·《喜宴》</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050403;
    font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
  #c { display: block; width: 100%; height: 100%; }

  /* ---------- 标题 ---------- */
  #title {
    position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(ellipse at 50% 42%, #2a0608 0%, #0c0304 55%, #030202 100%);
    transition: opacity 0.9s ease; color: #cbb37a;
  }
  #title .xi {
    font-size: 96px; color: #a50f16; line-height: 1;
    text-shadow: 0 0 34px rgba(165, 15, 22, 0.55), 0 0 4px rgba(231, 182, 76, 0.4);
    font-family: "Noto Serif SC", "SimSun", serif;
  }
  #title h1 {
    font-size: 54px; letter-spacing: 0.45em; text-indent: 0.45em; font-weight: 700;
    color: #e7c25c; font-family: "Noto Serif SC", "SimSun", serif;
    text-shadow: 0 2px 18px rgba(0,0,0,0.8);
  }
  #title h2 { font-size: 17px; letter-spacing: 0.9em; text-indent: 0.9em; color: #9c8a64; font-weight: 400; }
  #title .sub { font-size: 14px; color: #6e5f48; margin-top: 6px; letter-spacing: 0.2em; }
  #title .ctl {
    margin-top: 26px; font-size: 13.5px; color: #8d7f66; line-height: 2.1; text-align: center;
    border-top: 1px solid #3a2a1a; border-bottom: 1px solid #3a2a1a; padding: 14px 34px;
  }
  #title .ctl b { color: #d8b050; }
  #startBtn {
    margin-top: 30px; padding: 14px 64px; font-size: 20px; letter-spacing: 0.5em; text-indent: 0.5em;
    color: #e7c25c; background: linear-gradient(180deg, #6e0d12, #4a080c);
    border: 1px solid #a5772e; cursor: pointer; font-family: inherit;
    box-shadow: 0 0 30px rgba(165, 15, 22, 0.35);
    transition: all 0.25s ease;
  }
  #startBtn:hover { background: linear-gradient(180deg, #8e1016, #5a0a0e); box-shadow: 0 0 44px rgba(165,15,22,0.6); }
  #title .warn { margin-top: 16px; font-size: 12px; color: #55483a; }

  /* ---------- HUD ---------- */
  #subtitle {
    position: fixed; bottom: 9%; left: 50%; transform: translateX(-50%); z-index: 20;
    max-width: 72%; text-align: center; font-size: 19px; color: #e9dcc2; line-height: 1.7;
    text-shadow: 0 1px 3px #000, 0 0 14px rgba(0,0,0,0.9);
    opacity: 0; transition: opacity 0.45s ease; pointer-events: none;
  }
  #objective {
    position: fixed; top: 26px; left: 30px; z-index: 20; max-width: 460px;
    font-size: 14.5px; color: #cbb98e; line-height: 1.75;
    text-shadow: 0 1px 2px #000; opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
    border-left: 2px solid #8e0c12; padding-left: 12px;
  }
  #objective b { color: #e7c25c; }
  .obj-mark { color: #a50f16; }
  .obj-flash { animation: objflash 1.2s ease; }
  @keyframes objflash { 0% { background: rgba(165,15,22,0.28); } 100% { background: transparent; } }
  #prompt {
    position: fixed; left: 50%; top: 58%; transform: translateX(-50%); z-index: 20;
    font-size: 16.5px; color: #f0e6cc; text-shadow: 0 1px 3px #000;
    background: rgba(12, 6, 5, 0.65); border: 1px solid rgba(165, 118, 46, 0.45);
    padding: 8px 22px; opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
  }
  #prompt b { color: #e7c25c; }
  #card {
    position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    opacity: 0; transition: opacity 0.8s ease; pointer-events: none;
  }
  .card-title {
    font-size: 44px; letter-spacing: 0.4em; text-indent: 0.4em; color: #e7c25c;
    font-family: "Noto Serif SC", "SimSun", serif;
    background: linear-gradient(180deg, rgba(110,13,18,0.92), rgba(74,8,12,0.92));
    padding: 18px 60px; border: 1px solid #a5772e;
    box-shadow: 0 0 60px rgba(165,15,22,0.5);
  }
  .card-sub { font-size: 15px; color: #b09468; letter-spacing: 0.5em; text-indent: 0.5em; }
  #callHint {
    position: fixed; top: 15%; left: 50%; transform: translateX(-50%); z-index: 22;
    color: #ff4a3c; font-size: 17px; letter-spacing: 0.3em; text-indent: 0.3em;
    text-shadow: 0 0 18px rgba(255, 40, 30, 0.7);
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
    animation: callpulse 1s ease-in-out infinite;
  }
  @keyframes callpulse { 50% { transform: translateX(-50%) scale(1.06); } }
  #timerbar {
    position: fixed; top: 0; left: 0; width: 100%; height: 5px; z-index: 26;
    background: rgba(20, 6, 6, 0.8); opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
  }
  #timerfill { height: 100%; width: 100%; background: linear-gradient(90deg, #a50f16, #ff4a3c);
    box-shadow: 0 0 12px rgba(255, 40, 30, 0.8); transition: width 0.2s linear; }
  #fade { position: fixed; inset: 0; z-index: 30; background: #000; opacity: 1; pointer-events: none; }
  #resume {
    position: fixed; inset: 0; z-index: 35; display: none; align-items: center; justify-content: center;
    background: rgba(3, 2, 2, 0.72); color: #cbb37a; font-size: 20px; letter-spacing: 0.4em;
    cursor: pointer;
  }
  #end {
    position: fixed; inset: 0; z-index: 45; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px;
    background: radial-gradient(ellipse at 50% 45%, #1a0405 0%, #050202 70%);
    opacity: 0; transition: opacity 1.2s ease;
  }
  #endTitle {
    font-size: 52px; color: #e7c25c; letter-spacing: 0.5em; text-indent: 0.5em;
    font-family: "Noto Serif SC", "SimSun", serif; text-shadow: 0 0 40px rgba(165,15,22,0.6);
  }
  #endBody { font-size: 16px; color: #b3a284; text-align: center; line-height: 2.1; }
  #endBody .dim { color: #6e5f48; font-size: 13px; }
  #endBody .red-big { color: #ff4a3c; font-size: 30px; letter-spacing: 0.6em; text-indent: 0.6em;
    font-family: "Noto Serif SC", "SimSun", serif; text-shadow: 0 0 24px rgba(255,40,30,0.5); }
  #endBtn {
    padding: 12px 52px; font-size: 17px; letter-spacing: 0.4em; text-indent: 0.4em;
    color: #e7c25c; background: linear-gradient(180deg, #6e0d12, #4a080c);
    border: 1px solid #a5772e; cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="subtitle"></div>
<div id="objective"></div>
<div id="prompt"></div>
<div id="card"></div>
<div id="callHint">—— 司仪点名 · 把腕绳寄挂到礼钩上 ——</div>
<div id="timerbar"><div id="timerfill"></div></div>
<div id="fade"></div>
<div id="resume">已 暂 停 —— 点 击 继 续</div>

<div id="end">
  <div id="endTitle"></div>
  <div id="endBody"></div>
  <button id="endBtn"></button>
</div>

<div id="title">
  <div class="xi">囍</div>
  <h1>返　潮</h1>
  <h2>FANCHAO ·「喜宴」</h2>
  <div class="sub">2001 · 蚀湾 · 南方大酒店 —— 一场全镇出席的婚宴</div>
  <div class="ctl">
    <b>WASD</b> 移动　<b>鼠标</b> 环顾　<b>Shift</b> 快走（有声）　<b>E</b> 牵红（摘绳 / 挂绳 / 寄挂）<br>
    红绳是侍应的全部动线，也是你的席位缆 —— 司仪点名时，把腕绳寄挂到礼钩上。<br>
    电视永远比现实先播一步。喜事不许退席。
  </div>
  <button id="startBtn">开　席</button>
  <div class="warn">建议佩戴耳机 · 画面含低照度与闪烁效果</div>
</div>

<script src="./dist/bundle.js"></script>
</body>
</html>
